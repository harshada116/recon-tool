{% extends "base.html" %}
{% block title %}Scanning {{ hostname }}…{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-lg-7">
      <div class="progress-wrap" id="scan-progress" data-job-id="{{ job_id }}">
        <div class="finding-meta mb-2">RECONNAISSANCE IN PROGRESS</div>
        <h3 class="mb-1">{{ hostname }}</h3>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
        <div class="spinner-mono" id="progress-label">Starting modules…</div>
        <div class="error-box mt-3" id="progress-error" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
